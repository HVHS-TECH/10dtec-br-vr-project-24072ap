<!DOCTYPE html>
<html>
  <head>

<script src="https://aframe.io/releases/1.1.0/aframe.min.js"></script>
<script src="https://rawgit.com/donmccurdy/aframe-extras/v2.1.1/dist/aframe-extras.loaders.min.js"></script> 

  </head>
    <body>
    <a-scene>
      <a-sky color="lightblue"></a-sky>
      
       <!-- Put this inside the <a-scene> -->
      <a-entity  
      ply-model="src:asses-1.ply" 
      position="0 1 -2" 
      rotation="-90 90 90"
      scale="1 1 1"
      animation="
      property: position;
      from: 1 1 -2;
      to: 3 1 -2;
      dur: 2000;
      loop: true;
      dir: alternate;
      "
      ></a-entity>
      <a-entity
      ply-model="src:asses-0.ply"
      position="1 1 -2"
      rotation="-90 90 90"
      scale="1 1 1"
      animation="
      property: position;
      from: 1 1 -2;
      to: 3 1 -2;
      dur: 2000;
      loop: true;
      dir:  reverse;
      "
      ></a-entity>
      
                 
    </a-scene>
  </body>
</html>
